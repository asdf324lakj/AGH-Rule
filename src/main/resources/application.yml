spring:
  application:
    name: adg-rule
  profiles:
    active: prod  #切换至 dev 即可输出调试信息

logging:
  file:
    path: ./logs

application:
  rule:
    #远程规则
    remote:
      - 'https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/AWAvenue-Ads-Rule.txt'  #AWAvenue 秋风规则
      - 'https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/pro.mini.txt' #hagezi 的专业版pro mini

    #本地规则
    local: #本地规则请将文件移动到项目路径rule目录中
      - 'mylist.txt'
  output:
    path: rule   #规则文件输出路径，相对路径默认从 项目目录开始
    files:
      all.txt:    #输出文件名
        - DNS_EXCEPTION #AdGuard Home例外规则
        - DNS_FILTER #规范域名拦截规则
        - HOSTS   #Hosts规则
        - REGEX   #严格正则规则，AdGH支持
        - MODIFY  #AdGuard客户端专用规则
      adgh.txt:
        - DNS_EXCEPTION
        - DNS_FILTER
        - REGEX
      hosts.txt:
        - HOSTS
      regex.txt:
        - REGEX
      domain.txt:
        - DNS_EXCEPTION
        - DNS_FILTER
      modify.txt:
        - MODIFY
